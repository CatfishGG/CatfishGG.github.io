<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@catfishgg</title>
    <meta name="description" content="Cato's corner of the internet">
    <meta name="theme-color" content="#0f0f1a">
    <meta property="og:type" content="website">
    <meta property="og:title" content="@catfishgg">
    <meta property="og:description" content="Cato's corner of the internet">
    <link rel="icon" href="images/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --text-primary: #f0f0ff;
            --text-muted: rgba(240, 240, 255, 0.5);
            --accent: #a78bfa;
            --accent-2: #c084fc;
            --accent-3: #818cf8;
            --glow: rgba(167, 139, 250, 0.4);
            --radius: 24px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #07070f;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           ANIMATED AURORA BACKGROUND
           ============================================ */
        .aurora-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            background: radial-gradient(ellipse at 50% 0%, #0d0d1a 0%, #07070f 70%);
        }

        .aurora {
            position: absolute;
            width: 200%;
            height: 70%;
            top: -20%;
            left: -50%;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(88, 28, 135, 0.4) 20%,
                rgba(124, 58, 237, 0.3) 35%,
                rgba(167, 139, 250, 0.2) 50%,
                rgba(192, 132, 252, 0.15) 65%,
                rgba(129, 140, 248, 0.1) 80%,
                transparent 100%
            );
            filter: blur(60px);
            animation: auroraMove 12s ease-in-out infinite;
            opacity: 0.7;
        }

        .aurora::before,
        .aurora::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            filter: blur(40px);
        }

        .aurora::before {
            animation: auroraMove 15s ease-in-out infinite reverse;
            opacity: 0.6;
            transform: translateY(15%);
        }

        .aurora::after {
            animation: auroraMove 18s ease-in-out infinite;
            opacity: 0.4;
            transform: translateY(30%);
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(236, 72, 153, 0.2) 30%,
                rgba(167, 139, 250, 0.15) 50%,
                rgba(99, 102, 241, 0.1) 70%,
                transparent 100%
            );
        }

        @keyframes auroraMove {
            0%, 100% {
                transform: translateX(-5%) rotate(-2deg) scaleY(1);
            }
            25% {
                transform: translateX(5%) rotate(1deg) scaleY(1.1);
            }
            50% {
                transform: translateX(-3%) rotate(-1deg) scaleY(0.95);
            }
            75% {
                transform: translateX(3%) rotate(2deg) scaleY(1.05);
            }
        }

        /* Star particles */
        .stars {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: var(--max-opacity); transform: scale(1); }
        }

        /* Shooting stars */
        .shooting-star {
            position: absolute;
            width: 150px;
            height: 1px;
            background: linear-gradient(90deg, rgba(167,139,250,0.8), transparent);
            transform: rotate(var(--angle));
            animation: shoot var(--duration) linear infinite;
            opacity: 0;
            filter: blur(0.5px);
        }

        .shooting-star::before {
            content: '';
            position: absolute;
            right: 0;
            top: -1px;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(167,139,250,0.6);
        }

        @keyframes shoot {
            0% {
                transform: rotate(var(--angle)) translateX(0);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            30% {
                transform: rotate(var(--angle)) translateX(-400px);
                opacity: 0;
            }
            100% {
                opacity: 0;
            }
        }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: floatOrb var(--duration) ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124,58,237,0.4) 0%, transparent 70%);
            top: 10%;
            left: -5%;
            animation-duration: 20s;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(236,72,153,0.3) 0%, transparent 70%);
            bottom: 5%;
            right: -5%;
            animation-duration: 25s;
            animation-delay: -8s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, transparent 70%);
            top: 40%;
            right: 15%;
            animation-duration: 18s;
            animation-delay: -12s;
        }

        .orb-4 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(192,132,252,0.25) 0%, transparent 70%);
            top: 60%;
            left: 20%;
            animation-duration: 22s;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(20px, -30px) scale(1.05); }
            50% { transform: translate(-15px, 15px) scale(0.95); }
            75% { transform: translate(25px, 10px) scale(1.02); }
        }

        /* Grid mesh */
        .mesh-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(167,139,250,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(167,139,250,0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            animation: meshDrift 30s linear infinite;
            z-index: 2;
        }

        @keyframes meshDrift {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(80px); }
        }

        /* Scanline effect */
        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 3;
        }

        /* ============================================
           PROFILE CARD
           ============================================ */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border: 1px solid rgba(167, 139, 250, 0.15);
            border-radius: var(--radius);
            padding: 56px 52px;
            text-align: center;
            width: 380px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05),
                0 0 60px rgba(124,58,237,0.15),
                0 0 120px rgba(167,139,250,0.08),
                0 30px 60px rgba(0,0,0,0.5);
            animation: cardFloat 6s ease-in-out infinite, cardEntrance 1s cubic-bezier(0.16,1,0.3,1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes cardEntrance {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glow border effect */
        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(167,139,250,0.3), transparent 40%, transparent 60%, rgba(192,132,252,0.2));
            z-index: -1;
            animation: borderGlow 4s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .avatar-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 28px;
        }

        .avatar {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(167, 139, 250, 0.4);
            box-shadow:
                0 0 0 8px rgba(167, 139, 250, 0.06),
                0 0 40px rgba(167, 139, 250, 0.3),
                0 0 80px rgba(167, 139, 250, 0.15);
            animation: avatarPulse 3s ease-in-out infinite;
        }

        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 0 8px rgba(167,139,250,0.06), 0 0 40px rgba(167,139,250,0.3), 0 0 80px rgba(167,139,250,0.15); }
            50% { box-shadow: 0 0 0 12px rgba(167,139,250,0.08), 0 0 50px rgba(167,139,250,0.4), 0 0 100px rgba(167,139,250,0.2); }
        }

        .avatar-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(167, 139, 250, 0.2);
            animation: ringExpand 3s ease-in-out infinite;
        }

        .avatar-ring:nth-child(2) {
            inset: -12px;
            animation-delay: -1.5s;
            border-color: rgba(192, 132, 252, 0.15);
        }

        @keyframes ringExpand {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .handle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.1em;
            text-transform: lowercase;
            margin-bottom: 8px;
            animation: handleGlow 2s ease-in-out infinite;
        }

        @keyframes handleGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(167,139,250,0.3); }
            50% { text-shadow: 0 0 30px rgba(167,139,250,0.6), 0 0 40px rgba(167,139,250,0.3); }
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f0ff 0%, #a78bfa 50%, #c084fc 80%, #e879f9 100%);
            background-size: 200% 200%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: nameShimmer 4s ease-in-out infinite;
            margin-bottom: 12px;
        }

        @keyframes nameShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .bio {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 40px;
            font-style: italic;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(167,139,250,0.2), transparent);
            margin: 32px 0;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 22px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .link:hover::before {
            opacity: 0.15;
        }

        .link:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: rgba(167,139,250,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 30px var(--glow);
        }

        .link.github:hover { color: #f0f0ff; border-color: rgba(240,240,255,0.3); }
        .link.discord:hover { color: #5865F2; border-color: rgba(88,101,242,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 30px rgba(88,101,242,0.3); }
        .link.guns:hover { color: #f97316; border-color: rgba(249,115,22,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 30px rgba(249,115,22,0.3); }

        .link i {
            position: relative;
            z-index: 1;
            transition: transform 0.4s;
        }

        .link:hover i {
            transform: scale(1.15);
        }

        .tagline {
            margin-top: 36px;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(240,240,255,0.2);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="aurora-container">
        <div class="aurora"></div>
        <div class="stars" id="stars"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="mesh-grid"></div>
        <div class="scanlines"></div>
    </div>

    <div class="card">
        <div class="avatar-wrap">
            <div class="avatar-ring"></div>
            <div class="avatar-ring"></div>
            <img src="./images/cato.png" alt="Cato" class="avatar">
        </div>

        <div class="handle">catfishgg</div>
        <div class="name">Cato</div>
        <div class="bio">professional skid with skill issues</div>

        <div class="links">
            <a href="https://github.com/CatfishGG" target="_blank" rel="noopener" class="link github" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://discord.com/users/239699019415158787" target="_blank" rel="noopener" class="link discord" title="Discord">
                <i class="fa-brands fa-discord"></i>
            </a>
            <a href="https://guns.lol/cato1337" target="_blank" rel="noopener" class="link guns" title="guns.lol">
                <i class="fa-solid fa-gun"></i>
            </a>
        </div>

        <div class="tagline">sysadmin / developer / skid</div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
        // Generate star particles
        const starsContainer = document.getElementById('stars');
        const starCount = 80;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
            star.style.setProperty('--max-opacity', (0.3 + Math.random() * 0.7).toFixed(2));
            star.style.animationDelay = (-Math.random() * 6) + 's';
            starsContainer.appendChild(star);
        }

        // Generate shooting stars
        for (let i = 0; i < 3; i++) {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = (-10 + Math.random() * 40) + '%';
            star.style.setProperty('--angle', (-15 + Math.random() * 20) + 'deg');
            star.style.setProperty('--duration', (3 + Math.random() * 4) + 's');
            star.style.animationDelay = (-Math.random() * 10) + 's';
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
